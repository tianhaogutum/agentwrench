[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "agentwrench"
version = "0.1.0"
description = "Find and cut the tokens and breakages your Claude Code, Codex and MCP setup silently costs you: scan, slim, cache, doctor and more. Offline."
# README.md with repository-relative links rewritten for PyPI (see tool.hatch.metadata.hooks below).
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
authors = [{ name = "tianhaogutum" }]
keywords = [
    "ai-agents", "coding-agents", "claude-code", "codex", "mcp",
    "model-context-protocol", "agents-md", "langgraph", "apply-patch",
    "trajectory", "devtools", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    # mcp-config: lossless TOML/YAML round-trips (tomlkit 0.15 changes item types)
    "tomlkit>=0.13.3,<0.15",
    "ruamel.yaml>=0.18.16,<0.20",
    # gate: strict YAML policies and bounded regular expressions
    "PyYAML>=6.0.2",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
# `agentwrench checkpoints` reads LangGraph checkpoints through the official saver.
langgraph = [
    "langgraph-checkpoint>=4.3.1,<5",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
]
# Lets `agentwrench gate export-agentevals` output be scored with AgentEvals.
agentevals = ["agentevals>=0.0.9"]
test = [
    "agentwrench[langgraph,agentevals]",
    "pytest>=8.4",
    "langgraph>=1.2.20,<2",
    "mcp>=1.26,<2",
    "jsonschema>=4.23",
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/tianhaogutum/agentwrench"
Repository = "https://github.com/tianhaogutum/agentwrench"
Issues = "https://github.com/tianhaogutum/agentwrench/issues"
Documentation = "https://github.com/tianhaogutum/agentwrench/tree/main/docs"

[project.scripts]
agentwrench = "agentwrench.cli:main"

[project.entry-points.pytest11]
agentwrench_cassette = "agentwrench.cassette.pytest_plugin"

# PyPI cannot resolve repository-relative links or images: rewrite them to GitHub URLs.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# <img src>, <source srcset>: raw file URLs so the images render
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/tianhaogutum/agentwrench/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/tianhaogutum/agentwrench/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images, then Markdown links to files and directories
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/tianhaogutum/agentwrench/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/agentwrench/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# In-page anchors: PyPI does not generate heading ids
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/agentwrench#\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/agentwrench"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD_PARTY.md",
    "/pyproject.toml",
]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/export/vendor"]

[tool.ruff.lint]
# Correctness-focused set; the merged tools keep their original compact style.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules re-export fixtures and helpers across sibling modules and keep a compact style.
"tests/**" = ["F401", "F811", "F841", "E402", "E701", "E702", "E731"]
