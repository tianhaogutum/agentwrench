<svg xmlns="http://www.w3.org/2000/svg" width="860" height="614" viewBox="0 0 860 614" role="img" aria-labelledby="t d">
<title id="t">MCP tool-definition tokens per turn, before and after agentwrench slim</title>
<desc id="d">Bar chart from benchmarks/mcp-servers/results.json, tiktoken o200k_base. Typical stack: 19,052 before, 11,278 strip-only, 10,146 with slim plan; GitHub: 11,131 before, 6,215 strip-only, 5,945 with slim plan; Chrome DevTools: 6,751 before, 4,076 strip-only, 3,633 with slim plan; Playwright: 3,934 before, 2,320 strip-only, 2,165 with slim plan; Filesystem: 2,925 before, 2,081 strip-only, 1,562 with slim plan; Context7: 1,062 before, 662 strip-only, 474 with slim plan; Notion: 17,161 before, 15,506 strip-only, 15,026 with slim plan. No tool is removed in any column.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#f0f3f6}.m{fill:#9198a1}.h{font-size:17px;font-weight:600}.s{font-size:12.5px}.l{font-size:13.5px;font-weight:600}.v{font-size:12px;font-variant-numeric:tabular-nums}</style>
